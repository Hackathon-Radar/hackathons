name: Update hackathon list

on:
  schedule:
    # Daily at 03:17 UTC. Off the top of the hour, where GitHub drops the most scheduled runs.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # for the keepalive step below
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest README from Hackathon Radar
        run: |
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer ${{ secrets.README_FEED_SECRET }}" \
            "https://www.hackathonradar.com/api/public/hackathon-list" \
            -o README.md

      - name: Commit if changed
        run: |
          git config user.name "hackathon-radar-bot"
          git config user.email "bot@hackathonradar.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: refresh upcoming hackathons"
          git push

      # GitHub switches off scheduled workflows in public repos after 60 days
      # without activity, and the bot's own commits don't count. Re-enabling
      # the workflow on every run resets that clock.
      - name: Keep the schedule alive
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
